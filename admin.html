<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIRZY STORE — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#050914;color:#fff}header{padding:25px;text-align:center;background:linear-gradient(135deg,#071b3d,#0877ee)}h1{margin:0}.wrap{max-width:1050px;margin:auto;padding:20px 15px}.panel{background:#0c1626;border:1px solid #1b3555;border-radius:17px;padding:20px;margin-bottom:20px}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border-radius:9px;border:1px solid #29425f;background:#07111f;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{min-height:70px}.preview{width:100%;max-height:240px;object-fit:contain;display:none;background:#070b14;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.card{background:#0b1422;border:1px solid #1b3049;border-radius:15px;overflow:hidden}.card img{width:100%;height:160px;object-fit:cover}.body{padding:15px}.muted{color:#9eafc5;font-size:14px}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#123d25;color:#7cffad;font-size:12px;font-weight:bold}.sold{background:#481b1b;color:#ff9b9b}button{border:0;border-radius:9px;padding:11px 14px;background:#1684ff;color:#fff;font-weight:bold;cursor:pointer}.gray{background:#26374b}.danger{background:#d43d4f}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions>*{flex:1}.hidden{display:none!important}.notice{font-size:13px;color:#91a4ba}.login{max-width:430px;margin:50px auto}
</style></head><body><header><h1>DIRZY STORE ADMIN</h1><p>Kelola katalog online</p></header><main class="wrap">
<section id="login" class="panel login"><h2>🔐 Login Admin</h2><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button onclick="login()">Masuk</button><p class="notice">Akun dibuat melalui Supabase Authentication. Jangan masukkan password ke file HTML.</p></section>
<section id="app" class="hidden"><div class="panel"><button class="gray" onclick="logout()">Keluar</button></div>
<div class="panel"><h2 id="title">➕ Tambah ID</h2><input type="hidden" id="editId">
<label>Nama</label><input id="name" placeholder="ID FF Cantik #001"><div class="row"><div><label>UID</label><input id="uid"></div><div><label>Harga</label><input id="price" type="number"></div></div><div class="row"><div><label>Level</label><input id="level" type="number"></div><div><label>Rank</label><input id="rank"></div></div><label>Bundle / Spek</label><textarea id="bundle"></textarea><label>Foto ID</label><input id="photo" type="file" accept="image/*" onchange="preview()"><img id="prev" class="preview"><label>Status</label><select id="available"><option value="true">TERSEDIA</option><option value="false">SOLD</option></select><div class="actions"><button onclick="saveProduct()">💾 Simpan</button><button class="gray" onclick="resetForm()">Bersihkan</button></div></div>
<div class="panel"><h2>📦 Produk Online</h2><div id="list" class="grid"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let products=[],photoData=null;
async function login(){let email=document.getElementById("email").value,password=document.getElementById("password").value;let {error}=await db.auth.signInWithPassword({email,password});if(error)return alert(error.message);showApp()}
async function showApp(){let {data:{user}}=await db.auth.getUser();if(!user)return;let {data}=await db.from("admins").select("email").eq("email",user.email).maybeSingle();if(!data){await db.auth.signOut();return alert("Email ini bukan admin.")}document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");load()}
async function logout(){await db.auth.signOut();location.reload()}
async function load(){let {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error)return alert(error.message);products=data||[];render()}
function rp(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n)}
function render(){document.getElementById("list").innerHTML=products.map(p=>`<article class="card"><img src="${p.image_url||'https://placehold.co/700x400/0b2d61/fff?text=DIRZY'}"><div class="body"><b>${p.name}</b><p class="muted">UID ${p.uid}<br>Lv ${p.level} • ${p.rank}<br>${p.bundle}<br>${rp(p.price)}</p><div class="actions"><button onclick="edit(${p.id})">Edit</button><button class="gray" onclick="toggle(${p.id},${p.available})">${p.available?'SOLD':'Tersedia'}</button><button class="danger" onclick="del(${p.id})">Hapus</button></div></div></article>`).join("")}
function preview(){let f=document.getElementById("photo").files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photoData=r.result;document.getElementById("prev").src=photoData;document.getElementById("prev").style.display="block"};r.readAsDataURL(f)}
async function upload(file,id){let ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"");let path="products/"+id+"-"+crypto.randomUUID()+"."+ext;let {error}=await db.storage.from("product-images").upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return db.storage.from("product-images").getPublicUrl(path).data.publicUrl}
async function saveProduct(){let id=document.getElementById("editId").value;let obj={name:document.getElementById("name").value.trim(),uid:document.getElementById("uid").value.trim(),price:+document.getElementById("price").value||0,level:+document.getElementById("level").value||0,rank:document.getElementById("rank").value.trim()||"-",bundle:document.getElementById("bundle").value.trim()||"-",available:document.getElementById("available").value==="true"};if(!obj.name||!obj.uid)return alert("Nama dan UID wajib diisi.");let file=document.getElementById("photo").files[0];try{if(id){if(file)obj.image_url=await upload(file,id);let {error}=await db.from("products").update(obj).eq("id",id);if(error)throw error}else{let {data,error}=await db.from("products").insert(obj).select().single();if(error)throw error;if(file){let url=await upload(file,data.id);let x=await db.from("products").update({image_url:url}).eq("id",data.id);if(x.error)throw x.error}}resetForm();await load();alert("Tersimpan online.")}catch(e){alert(e.message)}}
function edit(id){let p=products.find(x=>x.id===id);document.getElementById("editId").value=p.id;document.getElementById("title").textContent="✏️ Edit ID";for(const [a,b] of [["name",p.name],["uid",p.uid],["price",p.price],["level",p.level],["rank",p.rank],["bundle",p.bundle]])document.getElementById(a).value=b;document.getElementById("available").value=String(p.available);if(p.image_url){document.getElementById("prev").src=p.image_url;document.getElementById("prev").style.display="block"}window.scrollTo({top:0,behavior:"smooth"})}
async function toggle(id,v){let {error}=await db.from("products").update({available:!v}).eq("id",id);if(error)return alert(error.message);load()}
async function del(id){if(!confirm("Hapus produk?"))return;let {error}=await db.from("products").delete().eq("id",id);if(error)return alert(error.message);load()}
function resetForm(){document.getElementById("editId").value="";document.getElementById("title").textContent="➕ Tambah ID";["name","uid","price","level","rank","bundle"].forEach(x=>document.getElementById(x).value="");document.getElementById("available").value="true";document.getElementById("photo").value="";document.getElementById("prev").style.display="none";photoData=null}
db.auth.getSession().then(({data})=>{if(data.session)showApp()});
</script></body></html>
