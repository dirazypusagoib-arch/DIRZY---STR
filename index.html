<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIRZY STORE — ID Free Fire</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#050914;color:#fff}header{padding:28px 16px;text-align:center;background:linear-gradient(135deg,#071b3d,#0877ee)}h1{margin:0;letter-spacing:2px}header p{color:#dcecff}main{max-width:1050px;margin:auto;padding:22px 15px}.hero,.box{background:#0c1626;border:1px solid #1b3555;border-radius:17px;padding:21px;margin-bottom:20px}.hero{background:linear-gradient(135deg,#0c1d36,#092c5d)}input{width:100%;padding:13px;border-radius:10px;border:1px solid #29425f;background:#07111f;color:#fff;margin:8px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.card{background:#0b1422;border:1px solid #1b3049;border-radius:15px;overflow:hidden}.card img{width:100%;height:165px;object-fit:cover}.body{padding:15px}.muted{color:#9eafc5;font-size:14px}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#123d25;color:#7cffad;font-size:12px;font-weight:bold}.sold{background:#481b1b;color:#ff9b9b}.price{font-size:21px;color:#58aaff;font-weight:bold;margin:10px 0}button{border:0;border-radius:9px;padding:11px 14px;background:#1684ff;color:#fff;font-weight:bold;cursor:pointer}.gray{background:#26374b}.actions{display:flex;gap:8px}.actions>*{flex:1}.empty{text-align:center;padding:30px;color:#8293a8}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalbox{width:100%;max-width:450px;background:#0d1726;border:1px solid #28425f;border-radius:18px;padding:20px}.modal input{margin-bottom:10px}.close{float:right}.notice{font-size:13px;color:#91a4ba}
</style></head><body>
<header><h1>DIRZY STORE</h1><p>Marketplace ID Free Fire</p></header>
<main><section class="hero"><h2>🔥 Cari ID FF</h2><p class="muted">Data katalog diperbarui online oleh admin.</p></section>
<input id="search" placeholder="Cari UID, nama, rank, level..."><div id="products" class="grid"></div></main>
<div id="modal" class="modal"><div class="modalbox"><button class="gray close" onclick="closeBuy()">✕</button><h2>🛒 Checkout</h2><div id="selected"></div>
<label>Nama pembeli</label><input id="buyer" placeholder="Nama kamu"><label>Metode pembayaran</label><select id="pay"><option>DANA</option><option>GoPay</option><option>OVO</option><option>Transfer Bank</option><option>Lainnya</option></select>
<button onclick="sendWA()">Pesan via WhatsApp</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let products=[],selected=null;
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function load(){let q=document.getElementById("search").value.toLowerCase();let {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error)return document.getElementById("products").innerHTML='<div class="empty">Gagal memuat katalog.</div>';products=data||[];render(q)}
function render(q=""){let list=products.filter(p=>(p.uid+" "+p.name+" "+p.rank+" "+p.level+" "+p.bundle).toLowerCase().includes(q));document.getElementById("products").innerHTML=list.length?list.map(p=>`<article class="card"><img src="${p.image_url||'https://placehold.co/700x400/0b2d61/fff?text=DIRZY+STORE'}"><div class="body"><span class="tag ${p.available?'':'sold'}">${p.available?'TERSEDIA':'SOLD'}</span><h3>${esc(p.name)}</h3><div class="muted">UID: <b>${esc(p.uid)}</b></div><div class="muted">Level ${p.level} • ${esc(p.rank)}</div><div class="muted">${esc(p.bundle)}</div><div class="price">${rp(p.price)}</div>${p.available?`<button onclick="openBuy(${p.id})">Beli Sekarang</button>`:`<button disabled style="opacity:.4">SOLD</button>`}</div></article>`).join(""):'<div class="empty">Produk tidak ditemukan.</div>'}
function openBuy(id){selected=products.find(p=>p.id===id);document.getElementById("selected").innerHTML=`<div class="box"><b>${esc(selected.name)}</b><br>UID: ${esc(selected.uid)}<br>Harga: <b>${rp(selected.price)}</b></div>`;document.getElementById("modal").classList.add("show")}
function closeBuy(){document.getElementById("modal").classList.remove("show")}
function sendWA(){let name=document.getElementById("buyer").value.trim()||"Belum diisi",pay=document.getElementById("pay").value;text=`Halo DIRZY STORE 👋\n\nSaya ingin membeli:\n• ${selected.name}\n• UID: ${selected.uid}\n• Harga: ${rp(selected.price)}\n• Nama: ${name}\n• Pembayaran: ${pay}\n\nMohon cek ketersediaan dan instruksi pembeliannya.`;location.href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(text)}
document.getElementById("search").oninput=e=>render(e.target.value.toLowerCase());load();
</script></body></html>
